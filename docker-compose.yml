services:
  db:
    image: pgvector/pgvector:pg16  # postgres:16 + pgvector extension, needed for the semantic cache
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vn_agent}
      POSTGRES_USER: ${POSTGRES_USER:-vn_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vn_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    volumes:
      # Persists the sentiment/embedding model downloads across restarts --
      # without this, every container restart re-downloads them from
      # HuggingFace Hub, adding a slow cold start to the first request(s).
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_URL: http://app:8000
    depends_on:
      - app
    ports:
      - "3000:3000"

volumes:
  db_data:
  hf_cache:
